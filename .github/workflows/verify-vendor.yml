name: Verify vendored engine dist

# Fails if the committed vendor/response-ready/dist has drifted from the response-ready
# source (i.e. someone changed the engine but forgot to re-run scripts/release-passport.mjs).
#
# This workflow used to stay green when RESPONSE_READY_PAT was absent: the engine checkout
# was skipped, the drift script found no sibling source and self-skipped, and the run
# reported success having compared nothing. That is exactly what happened — the vendored
# questionParser fell behind the engine and shipped to buyers under a green badge.
#
# It now fails closed. The secret is required, and VERIFY_VENDOR_REQUIRE_SOURCE=1 turns a
# missing sibling checkout into an error rather than a skip. (The skip still exists for
# Vercel, which legitimately builds this repo on its own.)

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  # Fired by response-ready when its own main moves, so an engine change is detected
  # from the engine side instead of waiting for someone to touch this repo.
  repository_dispatch:
    types: [engine-updated]

jobs:
  verify-vendor-dist:
    runs-on: ubuntu-latest
    env:
      RESPONSE_READY_PAT: ${{ secrets.RESPONSE_READY_PAT }}
      VERIFY_VENDOR_REQUIRE_SOURCE: '1'
    steps:
      - name: Checkout esg-passport
        uses: actions/checkout@v4
        with:
          path: esg-passport

      # Without this the run cannot mean anything, so say so loudly rather than
      # passing. A read-only PAT (or fine-grained token) for cye0407/response-ready,
      # stored as the RESPONSE_READY_PAT repository secret.
      - name: Require the engine token
        if: env.RESPONSE_READY_PAT == ''
        run: |
          echo "::error::RESPONSE_READY_PAT is not set. This check cannot compare the vendored"
          echo "::error::engine against its source without it, and a green run would be a lie."
          exit 1

      # Checks out the engine as a SIBLING dir (../response-ready), where the drift script and
      # vite.config.js expect it.
      - name: Checkout response-ready (engine source)
        uses: actions/checkout@v4
        with:
          repository: cye0407/response-ready
          token: ${{ env.RESPONSE_READY_PAT }}
          path: response-ready

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The engine build (tsc) requires its deps.
      - name: Install engine deps
        working-directory: response-ready
        run: npm ci

      # The drift script itself uses only Node built-ins, so no passport install is needed.
      - name: Verify vendored dist matches source
        working-directory: esg-passport
        run: npm run verify:vendor
